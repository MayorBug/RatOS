# RatOS hotspot configuration
# All values are simple KEY="value" pairs parsed by /usr/lib/ratos/hotspot-manager.sh.
# Set HOTSPOT_ENABLED=0 to fully disable the access point without uninstalling anything.

# Hotspot (AP) settings
HOTSPOT_ENABLED=1
HOTSPOT_INTERFACE="wlan1"   # set to "auto" to let NetworkManager pick the first Wi-Fi interface
HOTSPOT_SSID="RatOS"
HOTSPOT_PASSPHRASE="raspberry"  # must be at least 8 characters
HOTSPOT_CHANNEL=6              # use "auto" to let the driver decide
HOTSPOT_BAND="bg"              # valid values: bg (2.4GHz), a (5GHz) depending on hardware support
HOTSPOT_ADDRESS="192.168.50.1/24"
HOTSPOT_COUNTRY="DE"             # optional ISO-3166 country code passed to `iw reg set`

# Wi-Fi client configuration (used to join an existing network)
WIFI_SSID=""
WIFI_PASSPHRASE=""

# Optional behaviour controls
LAN_INTERFACES="eth0"      # space- or comma-separated list of wired interfaces that should disable the hotspot
AUTOSTOP_ON_WIFI=1         # set to 0 to keep hotspot running even when the device joins another Wi-Fi network
AUTOSTOP_ON_LAN=1          # set to 0 to keep hotspot running when LAN is connected
